<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-label="Bookshelf background">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9835f" />
      <stop offset="100%" stop-color="#8a5a3b" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b497" />
      <stop offset="100%" stop-color="#b68664" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="1000" fill="url(#panel)"/>
  <rect x="24" y="24" width="552" height="952" rx="20" fill="none" stroke="url(#wood)" stroke-width="22"/>

  <rect x="52" y="170" width="496" height="20" rx="10" fill="url(#wood)"/>
  <rect x="52" y="360" width="496" height="20" rx="10" fill="url(#wood)"/>
  <rect x="52" y="550" width="496" height="20" rx="10" fill="url(#wood)"/>
  <rect x="52" y="740" width="496" height="20" rx="10" fill="url(#wood)"/>

  <rect x="52" y="190" width="10" height="550" fill="#7d4f33" opacity="0.45"/>
  <rect x="538" y="190" width="10" height="550" fill="#7d4f33" opacity="0.45"/>

  <rect width="600" height="1000" fill="#000" filter="url(#grain)" opacity="0.2"/>
</svg>
